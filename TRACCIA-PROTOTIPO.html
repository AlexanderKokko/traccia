<!--
  ============================================================================
  TRACCIA — PROTOTIPO COMPLETO / FULL PROTOTYPE
  ============================================================================

  The whole app in one file. Open it by double-clicking. Nothing to install.

  TO CHANGE SOMETHING, ask Claude:
    "Here is our app prototype. <what you want changed>.
     Give me back the complete file."

  Everything lives below in three blocks:
    1. <style>  — colours, cards, buttons, the whole look
    2. DATA     — the nine conditions and every interface string (IT + EN)
    3. <script> — the screens, one React function each

  Needs an internet connection the first time, to load React.

  This is a PROTOTYPE for deciding how things should look. Nothing is saved,
  and changes here do not reach the real app — they get rebuilt there.
  ============================================================================
-->

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        background: 'hsl(var(--background))',

        canvas: 'hsl(var(--c-canvas))',

      borderColor: { 'line-soft': 'hsl(var(--c-line-soft))' },
      fontFamily: { display: ['var(--font-display)'] },
    },
  },
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');





  :root {

    --brand: #4faf82;
    --brand-dark: #3b9a6e;
    --brand-soft: #e8f5ee;

    /* shadcn-compatible tokens */
    --background: 210 20% 98%;
    --foreground: 166 29% 14%;
    --card: 0 0% 100%;
    --card-foreground: 166 29% 14%;
    --popover: 0 0% 100%;
    --popover-foreground: 166 29% 14%;
    --primary: 152 38% 50%;
    --primary-foreground: 0 0% 100%;
    --secondary: 140 8% 93%;
    --secondary-foreground: 166 29% 14%;
    --muted: 140 8% 93%;
    --muted-foreground: 159 7% 51%;
    --accent: 148 39% 94%;
    --accent-foreground: 152 38% 30%;
    --destructive: 0 72% 51%;
    --destructive-foreground: 0 0% 98%;
    --border: 140 8% 93%;
    --input: 140 8% 93%;
    --ring: 152 38% 50%;
    --radius: 14px;

    /* Traccia semantic tokens */
    --c-ink: 166 29% 14%;
    --c-ink-soft: 160 10% 33%;
    --c-canvas: 210 20% 98%;
    --c-line: 140 8% 92%;
    --c-line-soft: 140 8% 95%;
    --c-surface2: 140 8% 96%;
    --garden-ground-1: 140 16% 90%;
    --garden-ground-2: 140 16% 84%;

    --font-heading: 'Fraunces', Georgia, serif;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  .dark {
    --background: 165 32% 5%;
    --foreground: 140 14% 94%;
    --card: 165 30% 9%;
    --card-foreground: 140 14% 94%;
    --popover: 165 30% 9%;
    --popover-foreground: 140 14% 94%;
    --primary: 152 40% 58%;
    --primary-foreground: 165 32% 5%;
    --secondary: 165 28% 14%;
    --secondary-foreground: 140 14% 94%;
    --muted: 165 28% 14%;
    --muted-foreground: 140 10% 68%;
    --accent: 165 28% 16%;
    --accent-foreground: 140 14% 94%;
    --destructive: 0 60% 42%;
    --destructive-foreground: 0 0% 98%;
    --border: 165 28% 18%;
    --input: 165 28% 18%;
    --ring: 152 40% 58%;

    --c-ink: 140 14% 92%;
    --c-ink-soft: 140 8% 68%;
    --c-canvas: 165 32% 5%;
    --c-line: 165 28% 18%;
    --c-line-soft: 165 28% 16%;
    --c-surface2: 165 28% 16%;
    --garden-ground-1: 165 28% 14%;

  body {

  h2,
  h3,

  }

  /* ---------- Cards ---------- */
  .card-float {
    background-color: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 20px;
    box-shadow:
      0 1px 2px rgba(16, 24, 22, 0.03),
      0 18px 40px -14px rgba(16, 24, 22, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .card-float-lg {
    background-color: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 24px;
    box-shadow:
      0 1px 3px rgba(16, 24, 22, 0.04),
      0 24px 48px -16px rgba(16, 24, 22, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .card-inner {
    background-color: #f4f7f5;
    border: 1px solid #eef1f0;
    border-radius: 16px;
  }

  .dark .card-float,
  .dark .card-float-lg {
    background-color: rgba(22, 34, 30, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.3),
      0 22px 48px -16px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .dark .card-inner {
    background-color: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .dark .bg-brand-soft {
    background-color: rgba(79, 175, 130, 0.16);
  }

  .dark .bg-brand-softer {
    background-color: rgba(79, 175, 130, 0.1);
  }

  /* ---------- Inputs ---------- */
  .input-float {
    width: 100%;
    height: 52px;
    border: 1px solid #ebeeec;
    border-radius: 16px;
    background-color: #fff;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 450;
    color: #1a2f2a;
    outline: none;
    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease,
      background-color 0.15s ease;
    appearance: none;
  }

  .input-float::placeholder {
    color: rgba(26, 47, 42, 0.38);
  }

  .input-float:hover {
    border-color: #dde3df;
  }

  .input-float:focus {
    border-color: #4faf82;
    box-shadow: 0 0 0 4px rgba(79, 175, 130, 0.12);
    background-color: #fff;
  }

  select.input-float {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237A8B85' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    padding-right: 40px;
  }

  .dark .input-float {
    background-color: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
    color: hsl(var(--c-ink));
  }

  .dark .input-float::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }

  .dark select.input-float {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a8b5b0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  }

  /* ---------- Buttons ---------- */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #54b88e, #42a577);
    color: #fff;
    font-weight: 500;
    font-size: 14px;
    border-radius: 14px;
    padding: 13px 22px;
    border: none;
    cursor: pointer;
    box-shadow:
      0 6px 18px -5px rgba(79, 175, 130, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition:
      transform 0.1s ease,
      box-shadow 0.15s ease,
      filter 0.15s ease;
  }

  .btn-primary:hover {
    filter: brightness(1.05);
    box-shadow:
      0 10px 24px -5px rgba(79, 175, 130, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .btn-primary:active {
    transform: scale(0.97);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: none;
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #fff;
    color: #1a2f2a;
    font-weight: 500;
    font-size: 14px;
    border: 1px solid #ebeeec;
    border-radius: 14px;
    padding: 11px 18px;
    cursor: pointer;
    transition:
      border-color 0.15s ease,
      background-color 0.15s ease,
      transform 0.1s ease;
  }

  .btn-ghost:hover {
    border-color: #dde3df;
    background-color: #f9fafb;
  }

  .btn-ghost:active {
    transform: scale(0.97);
  }

  .dark .btn-ghost {
    background: rgba(255, 255, 255, 0.04);
    color: hsl(var(--c-ink));
    border-color: rgba(255, 255, 255, 0.08);
  }

  .btn-link {
    color: #4faf82;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease;
    background: none;
    border: none;
    padding: 0;
  }

  .btn-link:hover {
    color: #3b9a6e;
  }

  .btn-link.danger {
    color: #c56b6b;
  }

  .btn-link.danger:hover {
    color: #b05858;
  }

  /* ---------- Pills & chips ---------- */
  .nav-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    color: #7a8b85;
    white-space: nowrap;
    transition:
      color 0.15s ease,
      background-color 0.15s ease;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .nav-tab:hover {
    color: #465550;
  }

  .nav-tab.active {
    background-color: #e8f5ee;
    color: #1a3c34;
  }

  .dark .nav-tab {
    color: rgba(255, 255, 255, 0.55);
  }

  .dark .nav-tab:hover {
    color: rgba(255, 255, 255, 0.8);
  }

  .dark .nav-tab.active {
    background-color: rgba(79, 175, 130, 0.18);
    color: hsl(var(--c-ink));
  }

  .cond-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    border: 1.5px solid #ebeeec;
    background: #fff;
    color: #465550;
    cursor: pointer;
    transition:
      border-color 0.15s ease,
      background-color 0.15s ease,
      transform 0.1s ease,
      box-shadow 0.15s ease;
  }

  .cond-pill:hover {
    border-color: #c8d4ce;
    box-shadow: 0 2px 8px -2px rgba(16, 24, 22, 0.06);
  }

  .cond-pill:active {
    transform: scale(0.96);
  }

  .toggle-chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    border: 1.5px solid #ebeeec;
    background: #fff;
    color: #465550;
    cursor: pointer;
    transition:
      border-color 0.15s ease,
      background-color 0.15s ease,
      color 0.15s ease,
      transform 0.1s ease;
  }

  .toggle-chip:hover {
    border-color: #c8d4ce;
  }

  .toggle-chip:active {
    transform: scale(0.96);
  }

  .dark .cond-pill,
  .dark .toggle-chip {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
    color: hsl(var(--c-ink-soft));
  }

  /*
   * Soft brand wash laid over a card's own surface.
   *
   * This is a CSS class rather than Tailwind gradient utilities because
   * `from-*` / `via-*` stop utilities resolve to one literal color and ignore
   * the `.dark .bg-brand-softer` override — so a light mint stop stayed light
   * in dark mode and washed the whole card out white.
   */
  .card-sheen {
    background-image: linear-gradient(
      to bottom right,
      #f0f9f4,
      hsl(var(--background)) 50%,
      hsl(var(--background))
    );
  }

  .dark .card-sheen {
    background-image: linear-gradient(
      to bottom right,
      rgba(79, 175, 130, 0.14),
      hsl(var(--background)) 50%,
      hsl(var(--background))
    );
  }

  .modal-sheen {
    background-image: linear-gradient(to bottom, #f0f9f4, #ffffff);
  }

  .dark .modal-sheen {
    background-image: linear-gradient(to bottom, rgba(79, 175, 130, 0.1), transparent 60%);
  }

  /* ---------- Alert surfaces ---------- */
  .warn-soft {
    background-color: #fbeaec;
  }

  .dark .warn-soft {
    background-color: rgba(197, 107, 107, 0.16);
  }

  .amber-soft {
    background-color: #fbf0e3;
  }

  .dark .amber-soft {
    background-color: rgba(184, 134, 59, 0.16);
  }

  /* ---------- Misc ---------- */
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #eef1f0;
    border-top-color: #4faf82;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .font-500 {
    font-weight: 500;
  }
  .font-600 {
    font-weight: 600;
  }
  .font-700 {
    font-weight: 700;
  }

  .font-mono-data {
    font-family: var(--font-mono);
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

input[type='range'].traccia-slider {
  appearance: none;
  height: 10px;
  border-radius: 999px;

}

input[type='range'].traccia-slider::-webkit-slider-thumb {
  appearance: none;

@media print {
  .no-print {

</style>

<script>
/* The nine conditions and every interface string, taken from the real app. */
const TRACCIA_DATA = {"conditions":{"it":[{"key":"endometriosi","label":"Endometriosi","emoji":"🌙","color":"#B15E6C","definition":"L'endometriosi è una malattia infiammatoria cronica in cui un tessuto simile a quello che riveste l'utero (endometrio) cresce al di fuori dell'utero — su ovaie, tube o peritoneo pelvico. Può causare dolore pelvico cronico, mestruazioni molto dolorose, dolore durante i rapporti e, in alcuni casi, difficoltà a concepire.","alarmSymptoms":["Dolore pelvico acuto e improvviso molto intenso","Nausea o vomito intenso associato al dolore","Febbre alta (>38,5°C)","Sanguinamento vaginale abbondante e improvviso","Svenimento o vertigini improvvise"],"fields":[{"key":"pain_peak","type":"slider","label":"Dolore peggiore oggi (picco, non media)","min":0,"max":10},{"key":"daily_impact","type":"select","label":"Impatto sulle attività quotidiane","options":[{"value":"nessuno","label":"Nessuno"},{"value":"lieve","label":"Lieve"},{"value":"moderato","label":"Moderato — ho ridotto le attività"},{"value":"severo","label":"Severo — ho dovuto fermarmi"}]},{"key":"associated_symptoms","type":"chips","label":"Sintomi associati oggi","options":["Dispareunia","Sintomi intestinali","Sintomi urinari","Dolore lombare"]},{"key":"pain_med_taken","type":"select","label":"Hai preso un farmaco al bisogno per il dolore oggi?","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"}]},{"key":"pain_med_name","type":"text","label":"Nome del farmaco","placeholder":"es. Ibuprofene"}],"lifestyle":{"helps":["Alimentazione anti-infiammatoria (frutta, verdura, omega-3)","Attività fisica leggere e regolare (camminata, nuoto, yoga)","Curare sonno e gestione dello stress","Restare ben idratata"],"avoid":["Cibi ultra-processati e zuccheri raffinati","Eccesso di caffeina e alcol","Ignorare un dolore che peggiora progressivamente senza parlarne al medico"]},"contentCards":[{"title":"Il dolore non è \"normale\"","body":"Il dolore mestruale che interfere con le attività quotidiane non va considerato \"normale\" o da sopportare. Se i dolori ti costringono a modificare le tue abitudini, parlane con il tuo ginecologo."},{"title":"Tieni traccia dei cicli","body":"Registrare regolarità, intensità del dolore e sintomi associati al ciclo aiuta il medico a inquadrare meglio la situazione. Traccia anche i giorni senza sintomi: servono a costruire un quadro completo."}]},{"key":"ibd","label":"IBD","emoji":"🌀","color":"#5C7A99","definition":"Le malattie infiammatorie croniche intestinali (IBD) comprendono due forme principali, diverse tra loro: il Morbo di Crohn, che può colpire qualsiasi tratto dell'apparato digerente (dalla bocca all'ano) in modo discontinuo e \"a tutto spessore\" della parete intestinale, spesso con complicanze come fistole o stenosi; e la Colite Ulcerosa, che colpisce in modo continuo solo il colon e il retto, limitata allo strato più superficiale della mucosa, con sangue nelle feci più frequente. Entrambe condividono sintomi come dolore addominale, diarrea e stanchezza, ma localizzazione e complicanze tipiche differiscono.","alarmSymptoms":["Sangue abbondante nelle feci","Febbre alta (>38,5°C)","Dolore addominale intenso e improvviso","Distensione addominale marcata","Vomito persistente","Battito molto veloce (>120 bpm a riposo)"],"fields":[{"key":"ibd_type","type":"select","label":"Tipo di IBD (opzionale)","options":[{"value":"crohn","label":"Morbo di Crohn"},{"value":"colite_ulcerosa","label":"Colite Ulcerosa"},{"value":"indeterminata","label":"Colite indeterminata"},{"value":"non_specificato","label":"Non specificato"}]},{"key":"bristol_scale","type":"select","label":"Scala di Bristol","options":[{"value":"1","label":"Tipo 1 — sfere separate, dure"},{"value":"2","label":"Tipo 2 — a salsiccia, grumoso"},{"value":"3","label":"Tipo 3 — a salsiccia con crepe"},{"value":"4","label":"Tipo 4 — liscio e morbido"},{"value":"5","label":"Tipo 5 — pezzi morbidi"},{"value":"6","label":"Tipo 6 — pastoso"},{"value":"7","label":"Tipo 7 — liquido"}]},{"key":"bowel_movements","type":"number","label":"N. evacuazioni oggi","placeholder":"0"},{"key":"blood_present","type":"select","label":"Presenza di sangue","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"}]},{"key":"pain_location","type":"select","label":"Dolore addominale — zona","options":[{"value":"nessuna","label":"Nessuna"},{"value":"basso_dx","label":"Basso dx"},{"value":"basso_sx","label":"Basso sx"},{"value":"diffuso","label":"Diffuso"}]},{"key":"wellbeing_yesterday","type":"select","label":"Benessere generale di ieri (Harvey-Bradshaw)","options":[{"value":"molto_bene","label":"Molto bene"},{"value":"leggermente_sotto","label":"Leggermente sotto tono"},{"value":"scarso","label":"Scarso"},{"value":"molto_scarso","label":"Molto scarso"},{"value":"terribile","label":"Terribile"}]},{"key":"pain_intensity","type":"select","label":"Intensità dolore addominale","options":[{"value":"nessuno","label":"Nessuno"},{"value":"lieve","label":"Lieve"},{"value":"moderato","label":"Moderato"},{"value":"severo","label":"Severo"}]},{"key":"extraintestinal","type":"chips","label":"Manifestazioni extra-intestinali oggi","options":["Dolore articolare","Manifestazione cutanea","Fastidio oculare","Afte/ulcere orali"]}],"lifestyle":{"helps":["Alimentazione mediterranea, varia, ricca di frutta e verdura","Pasti piccoli e frequenti nelle fasi attive","Restare ben idratata","Confrontarsi con un dietista specializzato in IBD"],"avoid":["Cibi ultra-processati, zuccheri aggiunti e sale in eccesso","Restrizioni alimentari drastiche non guidate da un professionista","Ignorare febbre, sangue abbondante o perdita di peso importante"]},"contentCards":[{"title":"Differenza tra IBD e sindrome dell'intestino irritabile","body":"L'IBD è una malattia infiammatoria con riscontro di lesioni all'intestino, mentre la sindrome dell'intestino irritabile (IBS) è un disturbo funzionale senza infiammazione visibile. Pur condividendo alcuni sintomi, sono condizioni diverse che richiedono percorsi diversi."},{"title":"Le riacutizzazioni e le fasi di remissione","body":"L'IBD ha un andamento a fasi alternate: periodi di riacutizzazione dei sintomi e periodi di remissione. Tieni traccia dei cambiamenti e segnala al medico eventuali peggioramenti prolungati."}]},{"key":"emicrania","label":"Emicrania","emoji":"🧠","color":"#7A6A9E","definition":"L'emicrania è una malattia neurologica con attacchi ricorrenti di mal di testa, spesso pulsante e da un lato solo, associato a nausea e sensibilità a luce e suoni. Ha un legame forte con la regolarità delle abitudini quotidiane.","alarmSymptoms":["Il mal di testa peggiore mai avuto comparso improvvisamente","Difficoltà a parlare o confusione improvvisa","Debolezza o intorpidimento a un lato del corpo","Perdita di equilibrio improvvisa","Visione doppia o perdita della vista","Febbre alta con rigidità del collo"],"fields":[{"key":"associated_symptoms","type":"checkbox","label":"Sintomi associati","options":["Nausea","Fotofobia","Fonofobia"]},{"key":"triggers","type":"chips","label":"Trigger possibili oggi","options":["Stress","Sonno alterato","Alimenti","Ciclo/ormonale","Schermi/luce"]},{"key":"impact","type":"select","label":"Impatto sulle attività","options":[{"value":"nessuno","label":"Nessuno"},{"value":"lieve","label":"Lieve"},{"value":"moderato","label":"Moderato"},{"value":"severo","label":"Severo"}]},{"key":"medication_response","type":"select","label":"Farmaco sintomatico assunto?","options":[{"value":"no","label":"No"},{"value":"si_funzionato","label":"Sì — ha funzionato"},{"value":"si_parzialmente","label":"Sì — parzialmente"},{"value":"si_non_funzionato","label":"Sì — non ha funzionato"}]}],"lifestyle":{"helps":["Orari regolari di sonno e pasti","Restare ben idratata","Attività fisica moderata e regolare","Tecniche di gestione dello stress"],"avoid":["Saltare i pasti (può abbassare la glicemia e scatenare un attacco)","Eccesso di caffeina o interruzione brusca","Fumo ed esposizione al fumo passivo","Attività fisica improvvisa e troppo intensa"]},"contentCards":[{"title":"L'emicrania non è \"solo un mal di testa\"","body":"L'emicrania è una condizione neurologica complessa, non un semplice mal di testa. Gli attacchi possono durare da ore a giorni e includere sintomi come nausea, sensibilità alla luce e al rumore. Riconoscere i propri trigger è un passo importante."},{"title":"Il diario degli attacchi","body":"Registrare quando iniziano gli attacchi, la durata, i possibili trigger e la risposta ai farmaci aiuta il neurologo a personalizzare il trattamento. La regolarità delle abitudini è uno degli elementi chiave nella gestione."}]},{"key":"diabete","label":"Diabete","emoji":"🍬","color":"#B8863B","definition":"Il diabete è una condizione cronica in cui il corpo non produce abbastanza insulina o non la utilizza correttamente, causando livelli di glucosio nel sangue troppo alti. Nel tempo, se non ben gestito, può danneggiare vasi sanguigni, nervi, reni e occhi.","alarmSymptoms":["Glicemia molto bassa con confusione o quasi perdita di coscienza","Glicemia molto alta con nausea/vomito persistente","Respiro rapido e profondo o alito con odore fruttato","Forte dolore addominale","Confusione o difficoltà a restare sveglia/o"],"fields":[{"key":"glycemia","type":"number","label":"Glicemia (mg/dL)","placeholder":"es. 110"},{"key":"measurement_moment","type":"select","label":"Momento della misurazione","options":[{"value":"digiuno","label":"Digiuno"},{"value":"prima_pasto","label":"Prima pasto"},{"value":"dopo_pasto","label":"Dopo pasto (2h)"},{"value":"prima_dormire","label":"Prima di dormire"}]},{"key":"symptoms","type":"chips","label":"Sintomi oggi","options":["Sintomi di ipoglicemia","Sintomi di iperglicemia"]},{"key":"medication","type":"select","label":"Farmaco/insulina assunto come da terapia?","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"},{"value":"parzialmente","label":"Parzialmente"}]},{"key":"exercise_minutes","type":"number","label":"Attività fisica minuti oggi","placeholder":"0"}],"lifestyle":{"helps":["Pasti regolari e bilanciati, senza saltarli","Attività fisica regolare","Monitorare la glicemia come indicato dal medico","Assumere la terapia come prescritta"],"avoid":["Saltare i pasti o digiuni prolungati non concordati","Bevande zuccherate e cibi ultra-processati","Ignorare sintomi di ipoglicemia (tremore, sudorazione, confusione)"]},"contentCards":[{"title":"I valori di riferimento della glicemia","body":"I range mostrati nell'app (es. digiuno 70-130 mg/dL) sono basati sulle linee guida ADA e servono come riferimento. Il tuo target personale può differire: il diabetologo stabilisce gli obiettivi più adatti a te."},{"title":"Riconoscere l'ipoglicemia","body":"Tremore, sudorazione, palpitazioni, fame improvvisa e confusione possono segnalare un calo di zuccheri. Avere sempre con sé zuccheri rapidi (es. succo di frutta) e registrare l'episodio aiuta a prevenire future situazioni a rischio."}]},{"key":"pcos","label":"PCOS","emoji":"🌸","color":"#3E8E82","definition":"La sindrome dell'ovaio policistico (PCOS) è una condizione endocrina comune caratterizzata da cicli mestruali irregolari o assenti, segni di eccesso di androgeni (come acne o crescita di peli in eccesso) e, spesso, resistenza all'insulina. È una delle cause più frequenti di infertilità legata all'ovulazione.","alarmSymptoms":["Dolore pelvico acuto e improvviso molto intenso","Nausea o vomito intenso associato al dolore","Febbre alta","Svenimento o vertigini improvvise","Sanguinamento vaginale abbondante e anomalo"],"fields":[{"key":"cycle_day","type":"number","label":"Giorno del ciclo (opzionale)","placeholder":"es. 14"},{"key":"cycle_length","type":"number","label":"Lunghezza dell'ultimo ciclo (giorni)","placeholder":"es. 28"},{"key":"androgen_symptoms","type":"chips","label":"Sintomi androgenici oggi","options":["Acne","Crescita pelo viso/corpo","Diradamento capelli"]},{"key":"sugar_cravings","type":"select","label":"Voglie di zuccheri/carboidrati oggi","options":[{"value":"nessuna","label":"Nessuna"},{"value":"lievi","label":"Lievi"},{"value":"moderate","label":"Moderate"},{"value":"intense","label":"Intense"}]},{"key":"weight","type":"number","label":"Peso (kg, opzionale)","unit":"kg","placeholder":"es. 65"}],"lifestyle":{"helps":["Alimentazione a basso indice glicemico, ricca di fibre","Attività fisica regolare (aiuta la sensibilità insulinica)","Monitorare regolarità e lunghezza del ciclo","Curare il sonno e la gestione dello stress"],"avoid":["Cibi ultra-processati e zuccheri raffinati","Digiuni prolungati e diete drastiche","Ignorare cicli assenti per molti mesi consecutivi senza parlarne al medico"]},"contentCards":[{"title":"Criteri di Rotterdam","body":"La diagnosi di PCOS si basa sui criteri di Rotterdam: almeno 2 su 3 tra cicli irregolari/anovulazione, segni di eccesso androgeno e ovaie policistiche all'ecografia. Solo il medico può fare la diagnosi: l'app ti aiuta a tenere traccia dei dati."},{"title":"Resistenza all'insulina e stile di vita","body":"Molte persone con PCOS hanno resistenza all'insulina. L'attività fisica regolare e un'alimentazione a basso indice glicemico possono migliorare la sensibilità insulinica e la regolarità del ciclo."}]},{"key":"ipertiroidismo","label":"Ipertiroidismo","emoji":"⚡","color":"#C9694F","definition":"L'ipertiroidismo è una condizione in cui la tiroide produce un eccesso di ormoni tiroidei, accelerando il metabolismo del corpo. Può causare battito cardiaco accelerato o irregolare, perdita di peso involontaria, tremore, sudorazione eccessiva, ansia e insonnia. La causa più comune è il morbo di Graves.","alarmSymptoms":["Dolore al petto","Svenimento","Difficoltà respiratoria","Battito molto veloce (>120 bpm a riposo)","Battito molto lento (<45 bpm)","Confusione improvvisa","Febbre alta (>38,5°C)"],"fields":[{"key":"heart_rate","type":"number","label":"Frequenza cardiaca a riposo (bpm, opzionale)","placeholder":"es. 80"},{"key":"weight","type":"number","label":"Peso (kg, opzionale)","unit":"kg","placeholder":"es. 65"},{"key":"symptoms","type":"chips","label":"Sintomi oggi","options":["Palpitazioni","Tremore","Sudorazione eccessiva","Insonnia","Irritabilità/ansia"]}],"lifestyle":{"helps":["Assumere la terapia esattamente come prescritta e agli orari indicati","Monitorare frequenza cardiaca e peso","Limitare la caffeina","Riposo adeguato nonostante l'iperattività percepita"],"avoid":["Sospendere o modificare la terapia senza parlarne al medico","Eccesso di iodio senza supervisione medica","Ignorare palpitazioni persistenti o perdita di peso rapida e importante"]},"contentCards":[{"title":"Il morbo di Graves","body":"La causa più comune di ipertiroidismo è il morbo di Graves, una malattia autoimmune in cui il sistema immunitario stimola la tiroide a produrre troppi ormoni. Esistono anche altre cause: il medico stabilirà quella specifica del tuo caso."},{"title":"Monitorare battito e peso","body":"Registrare regolarmente la frequenza cardiaca a riposo e il peso aiuta a seguire l'andamento nel tempo. Variazioni rapide e importanti vanno segnalate tempestivamente al medico."}]},{"key":"ipotiroidismo","label":"Ipotiroidismo","emoji":"🐢","color":"#5A5FA6","definition":"L'ipotiroidismo è una condizione in cui la tiroide non produce abbastanza ormoni tiroidei, rallentando il metabolismo del corpo. Può causare stanchezza persistente, aumento di peso, intolleranza al freddo, stipsi, pelle secca, caduta di capelli e difficoltà di concentrazione. La causa più comune è la tiroidite di Hashimoto.","alarmSymptoms":["Dolore al petto","Svenimento","Difficoltà respiratoria","Battito molto veloce (>120 bpm a riposo)","Battito molto lento (<45 bpm)","Confusione improvvisa","Febbre alta (>38,5°C)"],"fields":[{"key":"fatigue","type":"slider","label":"Livello di stanchezza","min":0,"max":10},{"key":"weight","type":"number","label":"Peso (kg, opzionale)","unit":"kg","placeholder":"es. 65"},{"key":"symptoms","type":"chips","label":"Sintomi oggi","options":["Intolleranza al freddo","Stipsi","Pelle secca/caduta capelli","Difficoltà di concentrazione","Umore basso"]},{"key":"daytime_sleepiness","type":"select","label":"Sonnolenza durante il giorno?","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"}]},{"key":"mood_today","type":"select","label":"Come descriveresti il tuo umore oggi?","options":[{"value":"ottimo","label":"Ottimo"},{"value":"buono","label":"Buono"},{"value":"normale","label":"Normale"},{"value":"triste","label":"Triste"},{"value":"molto_depresso","label":"Molto depresso"}]},{"key":"bp_systolic","type":"number","label":"Pressione sistolica (mmHg, opzionale)","placeholder":"es. 120"},{"key":"bp_diastolic","type":"number","label":"Pressione diastolica (mmHg, opzionale)","placeholder":"es. 80"},{"key":"body_temp","type":"number","label":"Temperatura corporea (°C, opzionale)","placeholder":"es. 36.5"},{"key":"thyroid_intensity","type":"slider","label":"Quanto sono stati intensi oggi i sintomi della tiroide?","min":1,"max":10}],"lifestyle":{"helps":["Assumere la levotiroxina a digiuno, sempre alla stessa ora, come prescritta","Attendere almeno 30-60 minuti prima di mangiare o assumere altri farmaci/integratori","Attività fisica regolare e leggera","Alimentazione equilibrata con adeguato apporto di fibre"],"avoid":["Assumere la levotiroxina insieme a calcio, ferro o caffè (ne riducono l'assorbimento)","Sospendere la terapia perché \"ci si sente meglio\"","Ignorare stanchezza estrema e persistente pensando sia solo stress"]},"contentCards":[{"title":"La tiroidite di Hashimoto","body":"La causa più comune di ipotiroidismo è la tiroidite di Hashimoto, una malattia autoimmune in cui il sistema immunitario attacca la tiroide riducendone la funzione. È diagnosticata tramite esami del sangue (TSH, FT4, anticorpi anti-TPO)."},{"title":"Levotiroxina: l'assorbimento conta","body":"La levotiroxina va assunta a digiono, preferibilmente al mattino, aspettando 30-60 minuti prima di mangiare o assumere altri farmaci/integratori (soprattutto calcio e ferro, che ne riducono l'assorbimento). La costanza negli orari migliora la stabilità dei valori."}]},{"key":"fibromialgia","label":"Fibromialgia","emoji":"🌫️","color":"#9B6B8C","definition":"La fibromialgia è una malattia cronica caratterizzata da dolore muscoloscheletrico diffuso, presente da almeno tre mesi, spesso accompagnato da rigidità, sonno non ristoratore, stanchezza cronica e difficoltà di concentrazione (la cosiddetta \"nebbia mentale\"). Colpisce prevalentemente le donne, con un picco tra i 40 e i 60 anni.","alarmSymptoms":["Dolore al petto","Debolezza improvvisa e severa a un lato del corpo","Febbre alta (>38,5°C)","Gonfiore intenso e improvviso di una singola articolazione","Perdita di peso importante e non spiegata"],"fields":[{"key":"pain_areas","type":"chips","label":"Aree del corpo dolenti oggi (WPI)","options":["Braccia","Gambe","Schiena","Collo e spalle","Torace","Addome","Testa e viso"]},{"key":"restful_sleep","type":"select","label":"Sonno ristoratore stanotte?","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"}]},{"key":"brain_fog","type":"select","label":"Nebbia mentale oggi","options":[{"value":"nessuna","label":"Nessuna"},{"value":"lieve","label":"Lieve"},{"value":"moderata","label":"Moderata"},{"value":"intensa","label":"Intensa"}]},{"key":"morning_stiffness_min","type":"number","label":"Rigidità mattutina (minuti, opzionale)","unit":"min","placeholder":"es. 30"},{"key":"fatigue","type":"slider","label":"Livello di stanchezza","min":0,"max":10},{"key":"triggers","type":"chips","label":"Possibili trigger oggi","options":["Stress","Variazioni meteo","Sforzo fisico","Sonno alterato"]}],"lifestyle":{"helps":["Attività fisica leggera e graduale (stretching, nuoto, cammino)","Tecniche di gestione dello stress e rilassamento","Orari di sonno regolari","Ritmare le attività alternando sforzo e riposo"],"avoid":["Sforzi fisici intensi e improvvisi","Lunghi periodi di inattività totale","Ignorare un peggioramento marcato pensando sia \"solo stanchezza\""]},"contentCards":[{"title":"Non è \"tutto nella tua testa\"","body":"La fibromialgia è una condizione reale e riconosciuta, caratterizzata da una maggiore sensibilità al dolore. Non è un'invenzione e il dolore che avverti è reale. Una diagnosi chiara aiuta a intraprendere il percorso più adatto."},{"title":"Ritmo e gradualità","body":"L'attività fisica leggera e regolare, il sonno coerente e la gestione dello stress sono tra gli elementi più efficaci. L'obiettivo non è l'intensità, ma la costanza: piccoli passi ripetuti nel tempo."}]},{"key":"artrite_reumatoide","label":"Artrite Reumatoide","emoji":"🦴","color":"#8C7355","definition":"L'artrite reumatoide è una malattia infiammatoria autoimmune cronica che provoca dolore, gonfiore, rigidità e progressiva perdita di funzione delle articolazioni. Colpisce più frequentemente le piccole articolazioni di mani, polsi e piedi, in modo simmetrico. È diversa dall'artrosi (osteoartrosi), che è un processo degenerativo legato all'usura delle articolazioni, non su base autoimmune.","alarmSymptoms":["Febbre alta con un'articolazione molto calda, gonfia e dolorante (possibile artrite settica)","Dolore al petto o difficoltà respiratoria","Arrossamento e dolore oculare intenso","Intorpidimento o debolezza improvvisa","Gonfiore severo e improvviso di più articolazioni con malessere generale"],"fields":[{"key":"morning_stiffness_min","type":"number","label":"Rigidità mattutina (minuti)","unit":"min","placeholder":"es. 45"},{"key":"joint_swelling","type":"select","label":"Gonfiore articolare oggi?","options":[{"value":"si","label":"Sì"},{"value":"no","label":"No"}]},{"key":"affected_joints","type":"chips","label":"Articolazioni coinvolte oggi","options":["Mani e polsi","Gomiti","Spalle","Ginocchia","Caviglie e piedi","Colonna cervicale"]},{"key":"daily_impact","type":"select","label":"Impatto sulle attività quotidiane","options":[{"value":"nessuno","label":"Nessuno"},{"value":"lieve","label":"Lieve"},{"value":"moderato","label":"Moderato — ho ridotto le attività"},{"value":"severo","label":"Severo — ho dovuto fermarmi"}]}],"lifestyle":{"helps":["Assumere la terapia regolarmente, anche nei periodi senza sintomi","Attività fisica a basso impatto per mantenere la mobilità articolare","Applicare calore o freddo sulle articolazioni doloranti secondo le indicazioni del medico","Proteggere le articolazioni nei gesti quotidiani"],"avoid":["Interrompere la terapia perché \"ci si sente meglio\"","Sforzi articolari ripetuti e prolungati durante una riacutizzazione","Ignorare una singola articolazione molto calda e gonfia, specialmente con febbre"]},"contentCards":[{"title":"Artrite reumatoide e artrosi non sono la stessa cosa","body":"L'artrite reumatoide è una malattia autoimmune: il sistema immunitario attacca le articolazioni causando infiammazione. L'artrosi, invece, è un processo degenerativo legato all'usura della cartilagine. Hanno cause, trattamenti e prognosi diversi da chiarire con il reumatologo."},{"title":"La rigidità mattutina è un segnale importante","body":"La rigidità al risveglio, e quanto tempo ci vuole per migliorare, è un indicatore che aiuta il reumatologo a capire l'attività della malattia. Registrare i minuti di durata ogni giorno aiuta a costruire un quadro utile per le visite."}]}],"en":[{"key":"endometriosi","label":"Endometriosis","emoji":"🌙","color":"#B15E6C","definition":"Endometriosis is a chronic inflammatory disease in which tissue similar to the lining of the uterus (endometrium) grows outside the uterus — on the ovaries, fallopian tubes, or pelvic peritoneum. It can cause chronic pelvic pain, very painful periods, pain during intercourse, and, in some cases, difficulty conceiving.","alarmSymptoms":["Sudden, very intense acute pelvic pain","Severe nausea or vomiting associated with the pain","High fever (>38.5°C)","Sudden heavy vaginal bleeding","Sudden fainting or dizziness"],"fields":[{"key":"pain_peak","type":"slider","label":"Worst pain today (peak, not average)","min":0,"max":10},{"key":"daily_impact","type":"select","label":"Impact on daily activities","options":[{"value":"nessuno","label":"None"},{"value":"lieve","label":"Mild"},{"value":"moderato","label":"Moderate — I reduced activities"},{"value":"severo","label":"Severe — I had to stop"}]},{"key":"associated_symptoms","type":"chips","label":"Associated symptoms today","options":["Dyspareunia","Bowel symptoms","Urinary symptoms","Lower back pain"]},{"key":"pain_med_taken","type":"select","label":"Did you take an as-needed pain medication today?","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"}]},{"key":"pain_med_name","type":"text","label":"Medication name","placeholder":"e.g. Ibuprofen"}],"lifestyle":{"helps":["Anti-inflammatory diet (fruit, vegetables, omega-3)","Light, regular physical activity (walking, swimming, yoga)","Good sleep and stress management","Staying well hydrated"],"avoid":["Ultra-processed foods and refined sugars","Excess caffeine and alcohol","Ignoring progressively worsening pain without talking to your doctor"]},"contentCards":[{"title":"Pain is not \"normal\"","body":"Menstrual pain that interferes with daily activities should not be considered \"normal\" or something to endure. If pain forces you to change your habits, talk to your gynecologist."},{"title":"Track your cycles","body":"Recording cycle regularity, pain intensity, and associated symptoms helps your doctor better assess your situation. Track symptom-free days too — they help build a complete picture."}]},{"key":"ibd","label":"IBD","emoji":"🌀","color":"#5C7A99","definition":"Inflammatory bowel disease (IBD) includes two main, distinct forms: Crohn's disease, which can affect any part of the digestive tract (from mouth to anus) in a patchy, \"full-thickness\" pattern through the intestinal wall, often with complications like fistulas or strictures; and Ulcerative Colitis, which continuously affects only the colon and rectum, limited to the innermost lining, with blood in the stool more frequently. Both share symptoms like abdominal pain, diarrhea, and fatigue, but their typical location and complications differ.","alarmSymptoms":["Heavy blood in stool","High fever (>38.5°C)","Sudden, intense abdominal pain","Marked abdominal distension","Persistent vomiting","Very fast heart rate (>120 bpm at rest)"],"fields":[{"key":"ibd_type","type":"select","label":"Type of IBD (optional)","options":[{"value":"crohn","label":"Crohn's disease"},{"value":"colite_ulcerosa","label":"Ulcerative Colitis"},{"value":"indeterminata","label":"Indeterminate colitis"},{"value":"non_specificato","label":"Not specified"}]},{"key":"bristol_scale","type":"select","label":"Bristol stool scale","options":[{"value":"1","label":"Type 1 — separate hard lumps"},{"value":"2","label":"Type 2 — sausage-shaped, lumpy"},{"value":"3","label":"Type 3 — sausage with cracks"},{"value":"4","label":"Type 4 — smooth and soft"},{"value":"5","label":"Type 5 — soft blobs"},{"value":"6","label":"Type 6 — mushy"},{"value":"7","label":"Type 7 — liquid"}]},{"key":"bowel_movements","type":"number","label":"Number of bowel movements today","placeholder":"0"},{"key":"blood_present","type":"select","label":"Blood present","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"}]},{"key":"pain_location","type":"select","label":"Abdominal pain — location","options":[{"value":"nessuna","label":"None"},{"value":"basso_dx","label":"Lower right"},{"value":"basso_sx","label":"Lower left"},{"value":"diffuso","label":"Diffuse"}]},{"key":"wellbeing_yesterday","type":"select","label":"Yesterday's general wellbeing (Harvey-Bradshaw)","options":[{"value":"molto_bene","label":"Very well"},{"value":"leggermente_sotto","label":"Slightly off"},{"value":"scarso","label":"Poor"},{"value":"molto_scarso","label":"Very poor"},{"value":"terribile","label":"Terrible"}]},{"key":"pain_intensity","type":"select","label":"Abdominal pain intensity","options":[{"value":"nessuno","label":"None"},{"value":"lieve","label":"Mild"},{"value":"moderato","label":"Moderate"},{"value":"severo","label":"Severe"}]},{"key":"extraintestinal","type":"chips","label":"Extra-intestinal manifestations today","options":["Joint pain","Skin manifestation","Eye discomfort","Mouth sores/ulcers"]}],"lifestyle":{"helps":["Varied Mediterranean diet, rich in fruit and vegetables","Small, frequent meals during flares","Staying well hydrated","Consulting a dietitian specialized in IBD"],"avoid":["Ultra-processed foods, added sugars, and excess salt","Drastic dietary restrictions not guided by a professional","Ignoring fever, heavy blood, or significant weight loss"]},"contentCards":[{"title":"Difference between IBD and irritable bowel syndrome","body":"IBD is an inflammatory disease with visible intestinal damage, while irritable bowel syndrome (IBS) is a functional disorder without visible inflammation. While sharing some symptoms, they are different conditions requiring different approaches."},{"title":"Flares and remission phases","body":"IBD follows an alternating pattern: flare-ups and remission periods. Track changes and report any prolonged worsening to your doctor."}]},{"key":"emicrania","label":"Migraine","emoji":"🧠","color":"#7A6A9E","definition":"Migraine is a neurological disease with recurring headache attacks, often throbbing and one-sided, associated with nausea and sensitivity to light and sound. It has a strong link to the regularity of daily habits.","alarmSymptoms":["The worst headache ever, appearing suddenly","Sudden difficulty speaking or confusion","Weakness or numbness on one side of the body","Sudden loss of balance","Double vision or vision loss","High fever with neck stiffness"],"fields":[{"key":"associated_symptoms","type":"checkbox","label":"Associated symptoms","options":["Nausea","Photophobia","Phonophobia"]},{"key":"triggers","type":"chips","label":"Possible triggers today","options":["Stress","Altered sleep","Food","Cycle/hormonal","Screens/light"]},{"key":"impact","type":"select","label":"Impact on activities","options":[{"value":"nessuno","label":"None"},{"value":"lieve","label":"Mild"},{"value":"moderato","label":"Moderate"},{"value":"severo","label":"Severe"}]},{"key":"medication_response","type":"select","label":"Symptomatic medication taken?","options":[{"value":"no","label":"No"},{"value":"si_funzionato","label":"Yes — it worked"},{"value":"si_parzialmente","label":"Yes — partially"},{"value":"si_non_funzionato","label":"Yes — didn't work"}]}],"lifestyle":{"helps":["Regular sleep and meal times","Staying well hydrated","Moderate, regular physical activity","Stress management techniques"],"avoid":["Skipping meals (can lower blood sugar and trigger an attack)","Excess caffeine or abrupt withdrawal","Smoking and secondhand smoke exposure","Sudden, overly intense physical activity"]},"contentCards":[{"title":"Migraine is not \"just a headache\"","body":"Migraine is a complex neurological condition, not a simple headache. Attacks can last from hours to days and include symptoms like nausea and sensitivity to light and noise. Recognizing your own triggers is an important step."},{"title":"The attack diary","body":"Recording when attacks start, their duration, possible triggers, and response to medication helps your neurologist personalize treatment. Regular habits are a key element in management."}]},{"key":"diabete","label":"Diabetes","emoji":"🍬","color":"#B8863B","definition":"Diabetes is a chronic condition in which the body doesn't produce enough insulin or doesn't use it properly, causing blood glucose levels to be too high. Over time, if not well managed, it can damage blood vessels, nerves, kidneys, and eyes.","alarmSymptoms":["Very low blood sugar with confusion or near loss of consciousness","Very high blood sugar with persistent nausea/vomiting","Rapid, deep breathing or fruity-smelling breath","Severe abdominal pain","Confusion or difficulty staying awake"],"fields":[{"key":"glycemia","type":"number","label":"Blood glucose (mg/dL)","placeholder":"e.g. 110"},{"key":"measurement_moment","type":"select","label":"Measurement moment","options":[{"value":"digiuno","label":"Fasting"},{"value":"prima_pasto","label":"Before meal"},{"value":"dopo_pasto","label":"After meal (2h)"},{"value":"prima_dormire","label":"Before sleep"}]},{"key":"symptoms","type":"chips","label":"Symptoms today","options":["Hypoglycemia symptoms","Hyperglycemia symptoms"]},{"key":"medication","type":"select","label":"Medication/insulin taken as prescribed?","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"},{"value":"parzialmente","label":"Partially"}]},{"key":"exercise_minutes","type":"number","label":"Exercise minutes today","placeholder":"0"}],"lifestyle":{"helps":["Regular, balanced meals, not skipped","Regular physical activity","Monitoring blood glucose as directed by your doctor","Taking therapy as prescribed"],"avoid":["Skipping meals or unplanned prolonged fasting","Sugary drinks and ultra-processed foods","Ignoring hypoglycemia symptoms (shaking, sweating, confusion)"]},"contentCards":[{"title":"Blood glucose reference values","body":"The ranges shown in the app (e.g. fasting 70-130 mg/dL) are based on ADA guidelines and serve as a reference. Your personal target may differ — your diabetologist sets the goals best suited to you."},{"title":"Recognizing hypoglycemia","body":"Shaking, sweating, palpitations, sudden hunger, and confusion can signal low blood sugar. Always carrying fast-acting sugar (e.g. fruit juice) and logging the episode helps prevent future risky situations."}]},{"key":"pcos","label":"PCOS","emoji":"🌸","color":"#3E8E82","definition":"Polycystic ovary syndrome (PCOS) is a common endocrine condition characterized by irregular or absent menstrual cycles, signs of excess androgens (such as acne or excess hair growth), and often insulin resistance. It's one of the most common causes of ovulation-related infertility.","alarmSymptoms":["Sudden, very intense acute pelvic pain","Severe nausea or vomiting associated with the pain","High fever","Sudden fainting or dizziness","Heavy, abnormal vaginal bleeding"],"fields":[{"key":"cycle_day","type":"number","label":"Cycle day (optional)","placeholder":"e.g. 14"},{"key":"cycle_length","type":"number","label":"Length of last cycle (days)","placeholder":"e.g. 28"},{"key":"androgen_symptoms","type":"chips","label":"Androgenic symptoms today","options":["Acne","Facial/body hair growth","Hair thinning"]},{"key":"sugar_cravings","type":"select","label":"Sugar/carb cravings today","options":[{"value":"nessuna","label":"None"},{"value":"lievi","label":"Mild"},{"value":"moderate","label":"Moderate"},{"value":"intense","label":"Intense"}]},{"key":"weight","type":"number","label":"Weight (kg, optional)","unit":"kg","placeholder":"e.g. 65"}],"lifestyle":{"helps":["Low glycemic-index, fiber-rich diet","Regular physical activity (helps insulin sensitivity)","Monitoring cycle regularity and length","Good sleep and stress management"],"avoid":["Ultra-processed foods and refined sugars","Prolonged fasting and drastic diets","Ignoring absent cycles for many consecutive months without talking to your doctor"]},"contentCards":[{"title":"Rotterdam criteria","body":"PCOS diagnosis is based on the Rotterdam criteria: at least 2 of 3 among irregular cycles/anovulation, signs of androgen excess, and polycystic ovaries on ultrasound. Only a doctor can make the diagnosis — the app helps you track your data."},{"title":"Insulin resistance and lifestyle","body":"Many people with PCOS have insulin resistance. Regular physical activity and a low glycemic-index diet can improve insulin sensitivity and cycle regularity."}]},{"key":"ipertiroidismo","label":"Hyperthyroidism","emoji":"⚡","color":"#C9694F","definition":"Hyperthyroidism is a condition in which the thyroid produces excess thyroid hormones, speeding up the body's metabolism. It can cause a fast or irregular heartbeat, unintentional weight loss, tremor, excessive sweating, anxiety, and insomnia. The most common cause is Graves' disease.","alarmSymptoms":["Chest pain","Fainting","Difficulty breathing","Very fast heart rate (>120 bpm at rest)","Very slow heart rate (<45 bpm)","Sudden confusion","High fever (>38.5°C)"],"fields":[{"key":"heart_rate","type":"number","label":"Resting heart rate (bpm, optional)","placeholder":"e.g. 80"},{"key":"weight","type":"number","label":"Weight (kg, optional)","unit":"kg","placeholder":"e.g. 65"},{"key":"symptoms","type":"chips","label":"Symptoms today","options":["Palpitations","Tremor","Excessive sweating","Insomnia","Irritability/anxiety"]}],"lifestyle":{"helps":["Taking therapy exactly as prescribed and at the indicated times","Monitoring heart rate and weight","Limiting caffeine","Adequate rest despite the perceived hyperactivity"],"avoid":["Stopping or changing therapy without talking to your doctor","Excess iodine without medical supervision","Ignoring persistent palpitations or rapid, significant weight loss"]},"contentCards":[{"title":"Graves' disease","body":"The most common cause of hyperthyroidism is Graves' disease, an autoimmune disease in which the immune system stimulates the thyroid to produce too many hormones. Other causes exist too — your doctor will determine the specific one in your case."},{"title":"Monitoring heart rate and weight","body":"Regularly recording resting heart rate and weight helps track progress over time. Rapid, significant changes should be reported promptly to your doctor."}]},{"key":"ipotiroidismo","label":"Hypothyroidism","emoji":"🐢","color":"#5A5FA6","definition":"Hypothyroidism is a condition in which the thyroid doesn't produce enough thyroid hormones, slowing down the body's metabolism. It can cause persistent fatigue, weight gain, cold intolerance, constipation, dry skin, hair loss, and difficulty concentrating. The most common cause is Hashimoto's thyroiditis.","alarmSymptoms":["Chest pain","Fainting","Difficulty breathing","Very fast heart rate (>120 bpm at rest)","Very slow heart rate (<45 bpm)","Sudden confusion","High fever (>38.5°C)"],"fields":[{"key":"fatigue","type":"slider","label":"Fatigue level","min":0,"max":10},{"key":"weight","type":"number","label":"Weight (kg, optional)","unit":"kg","placeholder":"e.g. 65"},{"key":"symptoms","type":"chips","label":"Symptoms today","options":["Cold intolerance","Constipation","Dry skin/hair loss","Difficulty concentrating","Low mood"]},{"key":"daytime_sleepiness","type":"select","label":"Daytime sleepiness?","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"}]},{"key":"mood_today","type":"select","label":"How would you describe your mood today?","options":[{"value":"ottimo","label":"Great"},{"value":"buono","label":"Good"},{"value":"normale","label":"Normal"},{"value":"triste","label":"Sad"},{"value":"molto_depresso","label":"Very depressed"}]},{"key":"bp_systolic","type":"number","label":"Systolic blood pressure (mmHg, optional)","placeholder":"e.g. 120"},{"key":"bp_diastolic","type":"number","label":"Diastolic blood pressure (mmHg, optional)","placeholder":"e.g. 80"},{"key":"body_temp","type":"number","label":"Body temperature (°C, optional)","placeholder":"e.g. 36.5"},{"key":"thyroid_intensity","type":"slider","label":"How intense were your thyroid symptoms today?","min":1,"max":10}],"lifestyle":{"helps":["Taking levothyroxine fasting, always at the same time, as prescribed","Waiting at least 30-60 minutes before eating or taking other medications/supplements","Regular, light physical activity","Balanced diet with adequate fiber intake"],"avoid":["Taking levothyroxine together with calcium, iron, or coffee (reduces absorption)","Stopping therapy because you \"feel better\"","Ignoring extreme, persistent fatigue thinking it's just stress"]},"contentCards":[{"title":"Hashimoto's thyroiditis","body":"The most common cause of hypothyroidism is Hashimoto's thyroiditis, an autoimmune disease in which the immune system attacks the thyroid, reducing its function. It's diagnosed through blood tests (TSH, FT4, anti-TPO antibodies)."},{"title":"Levothyroxine: absorption matters","body":"Levothyroxine should be taken fasting, preferably in the morning, waiting 30-60 minutes before eating or taking other medications/supplements (especially calcium and iron, which reduce its absorption). Consistent timing improves value stability."}]},{"key":"fibromialgia","label":"Fibromyalgia","emoji":"🌫️","color":"#9B6B8C","definition":"Fibromyalgia is a chronic disease characterized by widespread musculoskeletal pain, present for at least three months, often accompanied by stiffness, unrefreshing sleep, chronic fatigue, and difficulty concentrating (the so-called \"brain fog\"). It mainly affects women, peaking between 40 and 60 years of age.","alarmSymptoms":["Chest pain","Sudden severe weakness on one side of the body","High fever (>38.5°C)","Sudden, intense swelling of a single joint","Significant unexplained weight loss"],"fields":[{"key":"pain_areas","type":"chips","label":"Painful body areas today (WPI)","options":["Arms","Legs","Back","Neck and shoulders","Chest","Abdomen","Head and face"]},{"key":"restful_sleep","type":"select","label":"Restful sleep last night?","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"}]},{"key":"brain_fog","type":"select","label":"Brain fog today","options":[{"value":"nessuna","label":"None"},{"value":"lieve","label":"Mild"},{"value":"moderata","label":"Moderate"},{"value":"intensa","label":"Intense"}]},{"key":"morning_stiffness_min","type":"number","label":"Morning stiffness (minutes, optional)","unit":"min","placeholder":"e.g. 30"},{"key":"fatigue","type":"slider","label":"Fatigue level","min":0,"max":10},{"key":"triggers","type":"chips","label":"Possible triggers today","options":["Stress","Weather changes","Physical exertion","Poor sleep"]}],"lifestyle":{"helps":["Light, gradual physical activity (stretching, swimming, walking)","Stress management and relaxation techniques","Regular sleep hours","Pacing activities, alternating effort and rest"],"avoid":["Sudden, intense physical exertion","Long periods of total inactivity","Ignoring a marked worsening thinking it's \"just fatigue\""]},"contentCards":[{"title":"It's not \"all in your head\"","body":"Fibromyalgia is a real, recognized condition characterized by heightened sensitivity to pain. It is not imagined, and the pain you feel is real. A clear diagnosis helps you start the most suitable path."},{"title":"Pace and gradual progress","body":"Light, regular physical activity, consistent sleep, and stress management are among the most effective elements. The goal is not intensity but consistency: small steps repeated over time."}]},{"key":"artrite_reumatoide","label":"Rheumatoid Arthritis","emoji":"🦴","color":"#8C7355","definition":"Rheumatoid arthritis is a chronic inflammatory autoimmune disease that causes pain, swelling, stiffness, and progressive loss of joint function. It most often affects the small joints of the hands, wrists, and feet, symmetrically. It differs from osteoarthritis, which is a degenerative process related to joint wear, not autoimmune.","alarmSymptoms":["High fever with a very hot, swollen, and painful joint (possible septic arthritis)","Chest pain or difficulty breathing","Intense eye redness and pain","Sudden numbness or weakness","Sudden, severe swelling of multiple joints with general malaise"],"fields":[{"key":"morning_stiffness_min","type":"number","label":"Morning stiffness (minutes)","unit":"min","placeholder":"e.g. 45"},{"key":"joint_swelling","type":"select","label":"Joint swelling today?","options":[{"value":"si","label":"Yes"},{"value":"no","label":"No"}]},{"key":"affected_joints","type":"chips","label":"Joints involved today","options":["Hands and wrists","Elbows","Shoulders","Knees","Ankles and feet","Cervical spine"]},{"key":"daily_impact","type":"select","label":"Impact on daily activities","options":[{"value":"nessuno","label":"None"},{"value":"lieve","label":"Mild"},{"value":"moderato","label":"Moderate — I reduced activities"},{"value":"severo","label":"Severe — I had to stop"}]}],"lifestyle":{"helps":["Taking therapy regularly, even during symptom-free periods","Low-impact physical activity to maintain joint mobility","Applying heat or cold to aching joints as advised by your doctor","Protecting joints in everyday tasks"],"avoid":["Stopping therapy because you \"feel better\"","Repeated, prolonged joint strain during a flare","Ignoring a single very hot, swollen joint, especially with fever"]},"contentCards":[{"title":"Rheumatoid arthritis and osteoarthritis are not the same","body":"Rheumatoid arthritis is an autoimmune disease: the immune system attacks the joints causing inflammation. Osteoarthritis is instead a degenerative process related to cartilage wear. They have different causes, treatments, and outcomes to clarify with your rheumatologist."},{"title":"Morning stiffness is an important signal","body":"Stiffness on waking, and how long it takes to improve, is an indicator that helps your rheumatologist understand disease activity. Logging the number of minutes each day helps build a useful picture for your visits."}]}]},"mood":[{"value":1,"emoji":"😞"},{"value":2,"emoji":"😕"},{"value":3,"emoji":"😐"},{"value":4,"emoji":"🙂"},{"value":5,"emoji":"😄"}],"noPain":["ipertiroidismo","ipotiroidismo"],"t":{"it":{"nav_diary":"Diario","nav_pathologies":"Le mie patologie","nav_documents":"Referti e documenti","nav_trends":"Andamento","nav_appointments":"Controlli","nav_therapies":"Terapie","nav_contents":"Contenuti","disclaimer":"Questo strumento aiuta a registrare e organizzare i tuoi sintomi. Non fornisce diagnosi né sostituisce il parere di un medico o specialista.","subtitle_home":"Facciamo una panoramica veloce dei tuoi sintomi giornalieri. Ci vorranno giusto 2 minuti.","onboarding_title":"Benvenuta in Traccia","onboarding <script type="text/babel" data-type="module">
/* ==========================================================================
   TRACCIA — PROTOTIPO / PROTOTYPE
   ==========================================================================

   The whole app in one file, written to be readable and edited by hand or by
   Claude. Everything below is plain React — no build step, no imports.

   HOW TO CHANGE THINGS
   --------------------
   · Text of the interface ....... the T object, further down
   · Colours, cards, buttons ..... the <style> block at the top of this file
   · A screen ..................... find the function named after it
                                     (DiaryScreen, TrendsScreen, ProfileScreen…)
   · The menu .................... the TABS array
   · Sample data ................. makeSampleEntries()

   This is a PROTOTYPE for deciding how things should look and behave. It is
   not the real product: nothing is saved anywhere, and there are no accounts.
   ========================================================================== */

const { useState, useMemo, useEffect, useRef } = React

/* --------------------------------------------------------------------------
   Data lifted from the real app: the nine conditions and every interface
   string, in Italian and English. Injected just above as TRACCIA_DATA.
   -------------------------------------------------------------------------- */
const DATA = TRACCIA_DATA
const T = DATA.t
const MOOD = DATA.mood
const NO_PAIN = DATA.noPain

const t = (key, lang) => (T[lang] && T[lang][key]) || T.it[key] || key
const conditionsFor = (lang) => DATA.conditions[lang] || DATA.conditions.it
const findCondition = (key, lang) => conditionsFor(lang).find((c) => c.key === key) || null

/* --------------------------------------------------------------------------
   Dates
   -------------------------------------------------------------------------- */
const MONTHS = {
  it: ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
}
const WEEKDAYS = {
  it: ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],
  en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
}

const todayISO = () => {
  const n = new Date()
  return new Date(n.getTime() - n.getTimezoneOffset() * 60000).toISOString().split('T')[0]
}
const minusDays = (iso, days) => {
  const d = new Date(iso)
  d.setDate(d.getDate() - days)
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]
}
const longDate = (date, lang) => {
  const d = typeof date === 'string' ? new Date(date) : date
  const wd = WEEKDAYS[lang][d.getDay()], mo = MONTHS[lang][d.getMonth()]
  return lang === 'en'
    ? `${wd}, ${mo} ${d.getDate()} ${d.getFullYear()}`
    : `${wd} ${d.getDate()} ${mo} ${d.getFullYear()}`
}
const shortDate = (date, lang) => {
  const d = typeof date === 'string' ? new Date(date) : date
  return lang === 'en'
    ? `${MONTHS[lang][d.getMonth()]} ${d.getDate()}`
    : `${d.getDate()} ${MONTHS[lang][d.getMonth()]}`
}
const greeting = (lang) => {
  const h = new Date().getHours()
  if (lang === 'en') return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'
  return h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'
}

/* --------------------------------------------------------------------------
   Sample data — so the charts and the streak have something to show.
   Change the numbers here to see how the screens react.
   -------------------------------------------------------------------------- */
function makeSampleEntries() {
  const modules = ['emicrania', 'endometriosi']
  const rows = []
  for (let i = 13; i >= 0; i--) {
    if (i === 4 || i === 9) continue          // a couple of missed days
    const pain = Math.max(0, Math.min(10, Math.round(4 + Math.sin(i / 2) * 3)))
    rows.push({
      id: 'sample-' + i,
      module: modules[i % modules.length],
      entry_date: minusDays(todayISO(), i),
      pain,
      energy: Math.max(0, Math.min(10, 9 - pain + (i % 3))),
      sleep_hours: 6 + (i % 4) * 0.5,
      mood: Math.max(1, Math.min(5, 5 - Math.round(pain / 3))),
      notes: i === 2 ? 'Giornata pesante, ho ridotto le attività.' : i === 7 ? 'Meglio dopo una camminata.' : null,
    })
  }
  return rows.reverse()
}

function Card({ children, className = '', large = false }) {
  return <div className={`${large ? 'card-float-lg' : 'card-float'} ${className}`}>{children}</div>

function Field({ label, children }) {
  return (
    <div>
      <label className="block text-[13px] font-500 text-ink/70 mb-1.5">{label}</label>

    </div>
  )
}

function Slider({ label, value, onChange, max = 10, color = '#4FAF82' }) {
  const pct = (value / max) * 100
  return (
    <div>
      <div className="flex items-center justify-between mb-2.5">
        <label className="text-[13px] font-500 text-ink/70">{label}</label>
        <span className="font-mono-data text-[15px] font-600 text-ink">
          {value}<span className="text-ink/35 font-400">/{max}</span>
        </span>
      </div>
      <input type="range" min="0" max={max} value={value} className="traccia-slider w-full"
             onChange={(e) => onChange(parseInt(e.target.value))}
             style={{ background: `linear-gradient(to right, ${color} ${pct}%, #EBEEEC ${pct}%)` }} />
    </div>
  )
}

/** A plain SVG line chart — no chart library, so it stays easy to tweak. */
function LineChart({ points, color = '#4FAF82', max = 10, height = 160 }) {
  const { lang } = useApp()
  const valid = points.filter((p) => p.value != null)
  if (valid.length < 2) {
    return <p className="text-[13px] text-ink/40 italic py-8 text-center">{t('need_more_days', lang)}</p>
  }
  const W = 600, H = height, padX = 24, padY = 16
  const stepX = (W - padX * 2) / (valid.length - 1)
  const coords = valid.map((p, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - p.value / max) * (H - padY * 2),
    ...p,
  }))
  const line = coords.map((c, i) => `${i ? 'L' : 'M'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ')

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height }}>
      {[0, 0.5, 1].map((f) => (
        <line key={f} x1={padX} x2={W - padX}
              y1={padY + f * (H - padY * 2)} y2={padY + f * (H - padY * 2)}
              stroke="currentColor" className="text-ink/10" strokeDasharray="3 3" />
      ))}
      <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {coords.map((c, i) => (
        <circle key={i} cx={c.x} cy={c.y} r="4" fill={color}>
          <title>{c.label}: {c.value}</title>
        </circle>
      ))}
    </svg>
  )
}

function Navbar() {
  const { lang, setLang, dark, setDark, screen, setScreen } = useApp()
  const navRef = useRef(null)
  const [edges, setEdges] = useState({ overflows: false, atStart: true, atEnd: true })

  const measure = () => {
    const el = navRef.current
    if (!el) return
    const max = el.scrollWidth - el.clientWidth
    setEdges({ overflows: max > 1, atStart: el.scrollLeft <= 1, atEnd: el.scrollLeft >= max - 1 })
  }

  useEffect(() => {
    const el = navRef.current
    if (!el) return
    const raf = requestAnimationFrame(measure)
    el.addEventListener('scroll', measure, { passive: true })
    window.addEventListener('resize', measure)
    return () => {
      cancelAnimationFrame(raf)
      el.removeEventListener('scroll', measure)
      window.removeEventListener('resize', measure)
    }
  }, [lang])

  const scrollBy = (dir) => {
    const el = navRef.current
    if (!el) return
    el.scrollBy({ left: dir * Math.max(el.clientWidth * 0.7, 160), behavior: 'smooth' })
  }

  const mask = edges.overflows
    ? `linear-gradient(to right, ${edges.atStart ? 'black 0' : 'transparent 0, black 20px'}, ${
        edges.atEnd ? 'black 100%' : 'black calc(100% - 20px), transparent 100%'})`
    : undefined

  return (
    <header className="sticky top-0 z-40 bg-background/80 backdrop-blur-xl border-b border-line">

                    title={dark ? 'Tema chiaro' : 'Tema scuro'}

            </button>
            <button onClick={() => setLang(lang === 'it' ? 'en' : 'it')}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-line bg-background text-xs font-500 text-ink-soft hover:border-brand/40 transition-colors">
              <span className="text-[13px] leading-none">{lang === 'it' ? '🇮🇹' : '🇬🇧'}</span>
              <span>{lang.toUpperCase()}</span>
            </button>
          </div>
        </div>

        <div className="flex items-center gap-1 pb-2.5">
          {edges.overflows && (
            <button onClick={() => scrollBy(-1)} disabled={edges.atStart}
                    className="shrink-0 flex items-center justify-center w-7 h-7 rounded-full border border-line bg-background text-ink-soft disabled:opacity-25 hover:border-brand/40 transition-all">
              <Icon name="chevronLeft" className="w-3.5 h-3.5" />
            </button>
          )}

          <nav ref={navRef} style={{ maskImage: mask, WebkitMaskImage: mask }}
               className="flex items-center gap-1 overflow-x-auto no-scrollbar flex-1 min-w-0">

/** The streak garden: one stem per logged day, flowers once the streak is long. */
function Garden({ streak }) {
  const { lang } = useApp()
  const tier = streak >= 14 ? 3 : streak >= 7 ? 2 : streak >= 3 ? 1 : streak >= 1 ? 0 : -1
  const W = 92, H = 46, pad = 12
  const stems = streak === 0 ? 0 : Math.min(streak, 6)
  const xs = stems === 1 ? [W / 2]
    : Array.from({ length: stems }).map((_, i) => pad + (i * (W - pad * 2)) / (stems - 1))
  const h = 14 + Math.min(streak, 12) * 2.2

  return (
    <div className="flex flex-col items-center gap-1.5">
      <svg viewBox={`0 0 ${W} ${H + 4}`} className="w-[92px] h-[54px]">
        <path d={`M0 ${H} L${W} ${H}`} stroke="hsl(var(--garden-ground-2))" strokeWidth="2.5" strokeLinecap="round" />
        {tier === -1 && <circle cx={W / 2} cy={H - 3} r="3" fill="#8C7355" opacity="0.6" />}
        {xs.map((x, i) => (
          <g key={i}>
            <path d={`M ${x} ${H} Q ${x - 3} ${H - h / 2} ${x} ${H - h}`} stroke="#4FAF82" strokeWidth="2.6" fill="none" strokeLinecap="round" />
            <ellipse cx={x - 5} cy={H - h * 0.5} rx="6" ry="3.2" fill="#54B88E" transform={`rotate(-26 ${x - 5} ${H - h * 0.5})`} />
            <ellipse cx={x + 5} cy={H - h * 0.7} rx="6" ry="3.2" fill="#4FAF82" transform={`rotate(26 ${x + 5} ${H - h * 0.7})`} />
            {tier >= 3 && <circle cx={x} cy={H - h} r="3.4" fill="#E8B86B" />}
          </g>
        ))}
      </svg>
      <div className="flex items-baseline gap-1">
        <span className="font-display text-[26px] font-700 text-brand-dark leading-none">{streak}</span>
        <span className="text-[11px] text-ink/45">{t(streak === 1 ? 'garden_day' : 'garden_days', lang)}</span>
      </div>
    </div>
  )
}

/** The extra questions a condition adds to the diary. */
function ModuleFields({ fields }) {
  const [values, setValues] = useState({})
  const set = (k, v) => setValues({ ...values, [k]: v })

  return (
    <div className="space-y-5">
      {fields.map((f) => {
        if (f.type === 'slider') {
          return <Slider key={f.key} label={f.label} value={values[f.key] ?? f.min ?? 0}
                         max={f.max ?? 10} onChange={(v) => set(f.key, v)} />
        }
        if (f.type === 'select') {
          return (
            <Field key={f.key} label={f.label}>
              <select className="input-float" value={values[f.key] || ''} onChange={(e) => set(f.key, e.target.value)}>
                <option value="">—</option>
                {(f.options || []).map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </Field>
          )
        }
        if (f.type === 'number') {
          return (
            <Field key={f.key} label={f.label}>
              <div className="flex items-center gap-2">
                <input type="number" className="input-float !w-36 font-mono-data" placeholder={f.placeholder || ''}
                       value={values[f.key] ?? ''} onChange={(e) => set(f.key, e.target.value)} />
                {f.unit && <span className="text-[13px] text-ink/50">{f.unit}</span>}
              </div>
            </Field>
          )
        }
        if (f.type === 'chips' || f.type === 'checkbox') {
          const chosen = values[f.key] || []
          return (
            <Field key={f.key} label={f.label}>
              <div className="flex flex-wrap gap-2">
                {(f.options || []).map((o) => {
                  const on = chosen.includes(o)
                  return (
                    <button key={o} className="toggle-chip"
                            style={on ? { backgroundColor: '#4FAF82', borderColor: '#4FAF82', color: '#fff' } : undefined}
                            onClick={() => set(f.key, on ? chosen.filter((c) => c !== o) : [...chosen, o])}>
                      {o}
                    </button>
                  )
                })}
              </div>
            </Field>
          )
        }
        return (
          <Field key={f.key} label={f.label}>
            <input className="input-float" placeholder={f.placeholder || ''}
                   value={values[f.key] || ''} onChange={(e) => set(f.key, e.target.value)} />
          </Field>
        )
      })}
    </div>
  )
}

function TrendsScreen() {
  const { lang, entries } = useApp()
  const [days, setDays] = useState(7)

    const from = minusDays(todayISO(), days - 1)
    return entries.filter((e) => e.entry_date >= from).slice().reverse()
  }, [entries, days])

  const avg = (key) => {
    const vals = period.map((e) => e[key]).filter((v) => v != null)
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null
  }

  const series = (key) => period.map((e) => ({ value: e[key], label: shortDate(e.entry_date, lang) }))

  const ribbon = useMemo(() => {
    const out = []

      out.push({ date, entry, color: entry ? (findCondition(entry.module, lang)?.color || '#7A8B85') : null })

/** The curved ribbon showing which days were logged, and how bad they were. */
function ContinuityRibbon({ days }) {
  const { lang } = useApp()
  const STEP = 36, BASE = 34, H = 150, SPAN = 64
  const W = Math.max(days.length * STEP, 1)
  const pts = days.map((d, i) => ({
    x: i * STEP + STEP / 2,
    y: d.entry && d.entry.pain != null ? BASE + (d.entry.pain / 10) * SPAN : BASE,
    day: d,
  }))
  const path = pts.map((p, i) => `${i ? 'L' : 'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ')

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="w-full" style={{ height: H }}>
        <line x1="0" y1={BASE} x2={W} y2={BASE} stroke="currentColor" className="text-ink/10" />
        <path d={path} fill="none" stroke="#4FAF82" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={p.day.entry ? 5 : 3.5}
                  fill={p.day.color || '#DDE3DF'} stroke="#fff" strokeWidth="1.5">
            <title>{shortDate(p.day.date, lang)}</title>
          </circle>
        ))}
      </svg>
      <div className="flex flex-wrap gap-3 mt-4">
        <div className="flex items-center gap-1.5">
          <div className="w-3 h-3 rounded-full" style={{ backgroundColor: '#DDE3DF' }} />
          <span className="text-[11.5px] text-ink/55">{t('no_entry', lang)}</span>
        </div>
      </div>
    </div>
  )
}

      <p className="text-[11.5px] text-ink/40 mt-4 italic leading-relaxed">{t('reminder_note', lang)}</p>
    </div>
  )
}

/* ==========================================================================
   SCREEN — RESOURCES / GUIDE
   ========================================================================== */

function ResourcesScreen() {
  const { lang } = useApp()
  const [filter, setFilter] = useState('all')
  const list = conditionsFor(lang)
  const cards = (filter === 'all' ? list : list.filter((c) => c.key === filter))
    .flatMap((c) => c.contentCards.map((card, i) => ({ ...card, condition: c, i })))

  return (
    <div>
      <h1 className="font-display text-[28px] sm:text-[34px] font-600 text-ink leading-[1.12] tracking-tight mb-1">
        {t('contents_title', lang)}
      </h1>
      <p className="text-ink/55 text-[14px] mb-5">{t('contents_subtitle', lang)}</p>

      <div className="flex flex-wrap gap-2 mb-6">
        <button className="toggle-chip" onClick={() => setFilter('all')}
                style={filter === 'all' ? { backgroundColor: '#4FAF82', borderColor: '#4FAF82', color: '#fff' } : undefined}>
          {t('all_filter', lang)}
        </button>
        {list.map((c) => (
          <button key={c.key} className="toggle-chip" onClick={() => setFilter(c.key)}
                  style={filter === c.key ? { backgroundColor: c.color, borderColor: c.color, color: '#fff' } : undefined}>
            <span>{c.emoji}</span>&nbsp;{c.label}
          </button>
        ))}
      </div>

      <div className="grid sm:grid-cols-2 gap-4">
        {cards.map((card) => (
          <Card key={card.condition.key + card.i} className="p-5 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1" style={{ backgroundColor: card.condition.color }} />
            <div className="flex items-center gap-2 mb-2.5 mt-1">
              <div className="flex items-center justify-center w-8 h-8 rounded-xl text-[16px]"
                   style={{ backgroundColor: card.condition.color + '14' }}>{card.condition.emoji}</div>
              <span className="text-[11px] font-500 px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: card.condition.color + '14', color: card.condition.color }}>
                {card.condition.label}
              </span>
            </div>
            <h3 className="font-display text-[17px] font-600 text-ink mb-2 leading-snug">{card.title}</h3>
            <p className="text-[13px] text-ink-soft leading-relaxed">{card.body}</p>
          </Card>
        ))}
      </div>
    </div>
  )
}

function GuideScreen() {
  const { lang } = useApp()
  const en = lang === 'en'
  return (
    <div>
      <h1 className="font-display text-[28px] sm:text-[34px] font-600 text-ink leading-[1.12] tracking-tight mb-1">
        {en ? 'Guide' : 'Guida'}
      </h1>
      <p className="text-ink/55 text-[14px] mb-6">
        {en ? 'How this prototype works.' : 'Come funziona questo prototipo.'}
      </p>

      <Card className="p-6">
        <h2 className="font-display text-[18px] font-600 text-ink mb-3">
          {en ? 'What you can change' : 'Cosa puoi cambiare'}
        </h2>
        <ul className="space-y-2.5 text-[13.5px] text-ink-soft leading-relaxed">
          <li>· {en ? 'Any wording — in the T object near the top of the file' : 'Qualsiasi testo — nell’oggetto T in cima al file'}</li>
          <li>· {en ? 'Colours and shapes — in the <style> block' : 'Colori e forme — nel blocco <style>'}</li>
          <li>· {en ? 'A screen — the function named after it, e.g. ProfileScreen' : 'Una schermata — la funzione con il suo nome, es. ProfileScreen'}</li>
          <li>· {en ? 'The menu — the TABS array' : 'Il menu — l’array TABS'}</li>
        </ul>
        <div className="mt-5 rounded-2xl p-4 amber-soft" style={{ border: '1px solid #B8863B30' }}>
          <p className="text-[13px] text-[#7A5623] leading-relaxed">
            {en
              ? 'This is a prototype for design decisions. Nothing is saved, and changes here do not reach the real app — they get rebuilt there once approved.'
              : 'Questo è un prototipo per le decisioni di design. Niente viene salvato e le modifiche qui non arrivano all’app vera: vengono ricostruite lì una volta approvate.'}
          </p>
        </div>
      </Card>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)

</script>
</body>
</html>
